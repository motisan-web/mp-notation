<!-- 特長 -->
<section class="bl_feature" data-mp="feature-card">

        <!-- 特長カード -->

                    <path d="M4 7h16M4 12h16M4 17h10"/>

            <!-- 検索 -->

                    <circle cx="11" cy="11" r="6"/>

                <h3 class="bl_feature_card_ttl">

                <h3 class="bl_feature_card_ttl">
                    見落とさない
